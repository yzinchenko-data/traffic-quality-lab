name: Synthetic traffic

# Запуск вручную: Actions → Synthetic traffic → Run workflow.
# Расписание выключено специально: включай, когда счётчик и GTM настроены.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Дата из плана кампании (YYYY-MM-DD)"
        required: true
        default: "2026-09-12"
      scale:
        description: "Доля визитов плана"
        required: true
        default: "0.05"
  # schedule:
  #   - cron: "0 9 * * *"

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m src.simulate.campaign --out data/raw
      - name: Play visits
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m src.simulate.visitor --site "$SITE_URL" --date "${{ inputs.date }}" --scale "${{ inputs.scale }}"
