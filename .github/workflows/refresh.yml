name: Daily refresh

# Запуск вручную: Actions → Daily refresh → Run workflow. Пересобирает отчёт по календарю,
# сдвинутому ко вчерашнему дню, и коммитит CSV для Google Sheets и DataLens.
# Расписание выключено, чтобы не тратить минуты Actions; включается так:
#   schedule:
#     - cron: "0 5 * * *"   # 08:00 МСК
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.pipeline --end yesterday
      - name: Commit exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/sheets datalens docs/img
          git diff --cached --quiet || git commit -m "Daily refresh: $(date -u +%F)"
          git push
