[project]
name = "traffic-quality-lab"
version = "0.1.0"
description = "Синтетический стенд анализа качества рекламного трафика: DSP → Верификатор → Метрика"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E501", "B905"]  # длину строк держит ruff format; zip с палитрой короче данных намеренно

[tool.ruff.format]
quote-style = "double"
